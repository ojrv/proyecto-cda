<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard Admin</title>
  <link rel="stylesheet" href="estilos.css" />
</head>
<body>

  <header class="encabezado">
    <img src="logo.png" alt="Logo institucional" />
    <h1>Panel Administrativo</h1>
    <h2>Acceso completo al sistema</h2>
  </header>

  <main>
    <section id="infoSesion">
      <p><span class="icono usuario"></span><strong id="nombreUsuario">Admin</strong></p>
      <p><span class="icono rol"></span><strong id="rolUsuario">admin</strong></p>
      <p><span class="icono fecha"></span><strong id="fechaActual">30 de septiembre de 2025</strong></p>
      <p><span class="icono hora"></span><strong id="horaActual">15:52</strong></p>
    </section>

    <h3>Funciones disponibles</h3>
    <section id="dashboardAdmin">
      <div class="tarjeta-funcion" data-funcion="gestionar_usuarios">👥 Gestión de usuarios</div>
      <div class="tarjeta-funcion" data-funcion="gestionar_reuniones">📅 Reuniones</div>
      <div class="tarjeta-funcion" data-funcion="gestionar_canciones">🎶 Canciones</div>
      <div class="tarjeta-funcion" data-funcion="gestionar_tandas">📜 Tandas por reunión</div>
      <div class="tarjeta-funcion" data-funcion="configuracion">⚙️ Configuración</div>
    </section>

    <section id="panelFuncionesPorRol">
      <h3>Funciones por rol</h3>

      <div class="bloque-rol" data-rol="admin">
        <h4>Admin</h4>
        <label><input type="checkbox" data-funcion="gestionar_usuarios"> Gestión de usuarios</label>
        <label><input type="checkbox" data-funcion="gestionar_reuniones"> Gestión de reuniones</label>
        <label><input type="checkbox" data-funcion="gestionar_canciones"> Gestión de canciones</label>
        <label><input type="checkbox" data-funcion="gestionar_tandas"> Gestión de tandas</label>
        <label><input type="checkbox" data-funcion="configuracion"> Configuración</label>
      </div>

      <div class="bloque-rol" data-rol="editor">
        <h4>Editor</h4>
        <label><input type="checkbox" data-funcion="gestionar_reuniones"> Gestión de reuniones</label>
        <label><input type="checkbox" data-funcion="gestionar_canciones"> Gestión de canciones</label>
        <label><input type="checkbox" data-funcion="gestionar_tandas"> Gestión de tandas</label>
      </div>

      <div class="bloque-rol" data-rol="musico">
        <h4>Músico</h4>
        <label><input type="checkbox" data-funcion="gestionar_tandas"> Visualización de tandas</label>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
  <script src="/js/roles.js" defer></script>
</body>
</html>
