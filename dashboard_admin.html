<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Panel Administrativo</title>
  <link rel="stylesheet" href="estilos.css" />
  <script src="https://kit.fontawesome.com/768734fbc4.js" crossorigin="anonymous"></script>
</head>
<body>
  <header class="encabezado">
    <img src="logo_cda.png" alt="Logo institucional" />
    <h1>Grupo de Adoración y Alabanza</h1>
    <h2>Panel Administrativo</h2>
  </header>

  <main>
    <section class="bloque-sesion">
      <div><i class="fas fa-user"></i> Oswaldo Rosas</div>
      <div><i class="fas fa-shield-alt"></i> Administrador</div>
      <div><i class="fas fa-calendar-day"></i> miércoles, 1 de octubre de 2025</div>
      <div><i class="fas fa-clock"></i> <span id="horaActual"></span></div>
    </section>

    <section class="formulario-dashboard">
      <button onclick="registrarUsuario()">Registrar nuevo usuario</button>
      <button onclick="editarNiveles()">Editar niveles institucionales</button>
      <button onclick="verEstadisticas()">Ver estadísticas por nivel</button>
      <button onclick="gestionarUsuarios()">Gestión de usuarios activos</button>
      <button onclick="configuracionSistema()">Configuración del sistema</button>
    </section>
  </main>

  <script>
    function actualizarHora() {
      const ahora = new Date();
      const opciones = {
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit',
        hour12: true
      };
      const horaFormateada = ahora.toLocaleTimeString('es-UY', opciones);
      document.getElementById('horaActual').textContent = horaFormateada;
    }

    setInterval(actualizarHora, 1000);

    function registrarUsuario() {
      window.location.href = 'registro.html';
    }

    function editarNiveles() {
      alert('Función en desarrollo: edición de niveles');
    }

    function verEstadisticas() {
      alert('Función en desarrollo: estadísticas por nivel');
    }

    function gestionarUsuarios() {
      alert('Función en desarrollo: gestión de usuarios');
    }

    function configuracionSistema() {
      alert('Función en desarrollo: configuración institucional');
    }
  </script>
</body>
</html>
