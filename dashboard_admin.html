<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Panel Administrativo</title>
  <link rel="stylesheet" href="estilos.css" />
  <script src="https://kit.fontawesome.com/768734fbc4.js" crossorigin="anonymous"></script>
</head>
<body>
  <header class="encabezado">
    <img src="logo_cda.png" alt="Logo institucional" />
    <h1>Grupo de Adoración y Alabanza</h1>
    <h2>Panel Administrativo</h2>
  </header>

  <main>
    <!-- 🔐 Bloque de sesión -->
    <section class="bloque-sesion">
      <div><i class="fas fa-user"></i> Oswaldo Rosas</div>
      <div><i class="fas fa-shield-alt"></i> Administrador</div>
      <div><i class="fas fa-calendar-day"></i> martes, 30 de setiembre de 2025</div>
      <div><i class="fas fa-clock"></i> 01:36:20 p. m.</div>
    </section>

    <!-- ⚙️ Funciones disponibles -->
    <section class="funciones-dashboard">
      <button>Registrar nuevo usuario</button>
      <button>Editar niveles</button>
      <button>Ver estadísticas</button>
      <button>Configuración institucional</button>
    </section>
  </main>

  <style>
    .bloque-sesion {
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 1rem;
      margin-bottom: 30px;
      padding-left: 10px;
    }

    .bloque-sesion i {
      margin-right: 8px;
      color: #555;
    }

    .funciones-dashboard {
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding-left: 20px;
    }

    .funciones-dashboard button {
      padding: 10px 16px;
      font-size: 1rem;
      border: none;
      background-color: #f0f0f0;
      border-radius: 6px;
      text-align: left;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    .funciones-dashboard button:hover {
      background-color: #e0e0e0;
    }
  </style>
</body>
</html>
