<script>
  const client = window.supabase.createClient(
    'https://fdlnptxefjzoxeiqsujx.supabase.co',
    'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZkbG5wdHhlZmp6b3hlaXFzdWp4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTg4NDE3ODIsImV4cCI6MjA3NDQxNzc4Mn0.BI9M80Fr-AevXnHBATTJZkRjFrCGn4x7cgDPkTinNms'
  );

  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();

    const alias = document.getElementById('alias').value.trim().toLowerCase();
    const clave = document.getElementById('clave').value;

    const { data: usuario, error } = await client
      .from('usuario')
      .select('alias, clave, nivelid, activo')
      .eq('alias', alias)
      .single();

    console.log('Resultado de búsqueda:', usuario, error); // 🔍 Depuración

    const mensaje = document.getElementById('mensaje');

    if (error || !usuario) {
      mensaje.textContent = 'Alias no encontrado';
      return;
    }

    if (!usuario.activo) {
      mensaje.textContent = 'Usuario inactivo';
      return;
    }

    if (usuario.clave !== clave) {
      mensaje.textContent = 'Contraseña incorrecta';
      return;
    }

    // ✅ Guardamos el usuario en localStorage
    localStorage.setItem('usuario', JSON.stringify(usuario));

    // ✅ Redirigimos según nivel
    switch (usuario.nivelid) {
      case 1:
        window.location.href = 'dashboard_admin.html';
        break;
      case 2:
        window.location.href = 'dashboard_editor.html';
        break;
      case 3:
        window.location.href = 'dashboard_musico.html';
        break;
      default:
        mensaje.textContent = 'Nivel no reconocido';
    }
  });
</script>
