<!DOCTYPE html>
<html lang="es">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Inicio de Sesión</title>
  <link rel="stylesheet" href="estilos.css" />
</head>
<body>

  <div class="logo-container">
    <img src="logo_cda.png" alt="Logo Iglesia Casa del Alfarero" />
  </div>

  <main>
    <h3>Acceso al Sistema Institucional</h3>

    <form id="formLogin" autocomplete="on">
      <label for="alias">Alias</label>
      <input type="text" id="alias" name="alias" required />

      <label for="clave">Contraseña</label>
      <input type="password" id="clave" name="password" required />

      <button type="submit">Iniciar Sesión</button>
    </form>

    <div id="mensaje-login" class="mensaje"></div>
  </main>

  <!-- Dashboards por rol -->
  <section id="dashboard-admin" class="dashboard" style="display:none">
    <h4>Panel de Administración</h4>
    <p>Gestión de usuarios, roles y módulos institucionales.</p>
  </section>

  <section id="dashboard-editor" class="dashboard" style="display:none">
    <h4>Panel de Edición</h4>
    <p>Carga y edición de contenido institucional.</p>
  </section>

  <section id="dashboard-lector" class="dashboard" style="display:none">
    <h4>Panel de Lectura</h4>
    <p>Visualización de contenidos y reportes.</p>
  </section>

  <!-- Cargar Supabase v1 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@1.35.6/dist/umd/supabase.min.js"></script>

  <!-- Script funcional -->
  <script>
    window.addEventListener('DOMContentLoaded', () => {
      // Reemplazá con tus credenciales reales
      const supabase = window.supabase.createClient('https://fdlnptxefjzoxeiqsujx.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZkbG5wdHhlZmp6b3hlaXFzdWp4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTg4NDE3ODIsImV4cCI6MjA3NDQxNzc4Mn0.BI9M80Fr-AevXnHBATTJZkRjFrCGn4x7cgDPkTinNms');

      document.getElementById('formLogin').addEventListener('submit', async (e) => {
        e.preventDefault();

        const alias = document.getElementById('alias').value.trim();
        const clave = document.getElementById('clave').value.trim();
        const mensaje = document.getElementById('mensaje-login');

        const { data: usuario, error } = await supabase
          .from('usuario')
          .select('nombreusuario, clave, activo, nivelid')
          .eq('alias', alias)
          .single();

        if (error || !usuario) {
          mensaje.textContent = 'Alias no encontrado';
          return;
        }

        if (!usuario.activo) {
          mensaje.textContent = 'Usuario inactivo';
          return;
        }

        if (usuario.clave !== clave) {
          mensaje.textContent = 'Contraseña incorrecta';
          return;
        }

        const { data: rolData, error: rolError } = await supabase
          .from('nivelesusuario')
          .select('nombrenivel')
          .eq('id', usuario.nivelid)
          .single();

        if (rolError || !rolData) {
          mensaje.textContent = 'Rol no encontrado';
          return;
        }

        const rol = rolData.nombrenivel;
        mensaje.textContent = `Bienvenido, ${usuario.nombreusuario} – Rol: ${rol}`;
        mostrarDashboardPorRol(rol);
      });

      function mostrarDashboardPorRol(rol) {
        document.querySelectorAll('.dashboard').forEach(div => div.style.display = 'none');
        const id = `dashboard-${rol}`;
        const modulo = document.getElementById(id);
        if (modulo) modulo.style.display = 'block';
      }
    });
  </script>
</body>
</html>
