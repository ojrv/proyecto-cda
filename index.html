<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Ingreso Institucional</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <header class="encabezado">
    <img src="logo_cda.png" alt="Logo institucional">
    <h1>Centro de Desarrollo Apostólico</h1>
    <h2>Ingreso al sistema</h2>
  </header>

  <main>
    <form id="loginForm">
      <label for="alias">Alias institucional</label>
      <input type="text" id="alias" placeholder="Ej: orosas" required>

      <label for="clave">Contraseña</label>
      <input type="password" id="clave" placeholder="Tu contraseña" required>

      <button type="submit">Ingresar</button>
      <div id="mensaje"></div>
    </form>
  </main>

  <script src="login.js"></script>
</body>
</html>
