<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ingreso Institucional</title>
  <link rel="stylesheet" href="estilos.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <header class="encabezado">
    <img src="logo_cda.png" alt="Logo institucional" />
    <h1>Grupo de Adoración y Alabanza</h1>
    <h2>Ingreso al sistema</h2>
  </header>

  <main>
    <form id="loginForm" class="formulario-dashboard">
      <label for="alias">Alias institucional</label>
      <input type="text" id="alias" placeholder="Tu alias" required />

      <label for="clave">Contraseña</label>
      <input type="password" id="clave" placeholder="Tu contraseña" required />

      <button type="submit">Ingresar</button>
      <div id="mensaje"></div>
    </form>
  </main>

  <script>
    const client = window.supabase.createClient(
      'https://fdlnptxefjzoxeiqsujx.supabase.co',
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZkbG5wdHhlZmp6b3hlaXFzdWp4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTg4NDE3ODIsImV4cCI6MjA3NDQxNzc4Mn0.BI9M80Fr-AevXnHBATTJZkRjFrCGn4x7cgDPkTinNms'
    );

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const alias = document.getElementById('alias').value.trim().toLowerCase();
      const clave = document.getElementById('clave').value;
      const mensaje = document.getElementById('mensaje');

      const { data: usuario, error } = await client
        .from('usuario')
        .select('alias, nombreusuario, clave, nivelid, activo')
        .eq('alias', alias)
        .single();

      if (error || !usuario || !usuario.alias || !usuario.clave) {
        mensaje.textContent = 'Alias no encontrado o datos incompletos';
        console.log('Respuesta incompleta:', usuario);
        return;
      }

      if (!usuario.activo) {
        mensaje.textContent = 'Usuario inactivo';
        return;
      }

      if (usuario.clave !== clave) {
        mensaje.textContent = 'Contraseña incorrecta';
        return;
      }

      // ✅ Blindaje: convertir nombreusuario en nombre
      const usuarioFinal = {
        alias: usuario.alias,
        nombre: usuario.nombreusuario || 'Sin nombre',
        nivelid: usuario.nivelid,
        activo: usuario.activo
      };

      localStorage.setItem('usuario', JSON.stringify(usuarioFinal));

      // ✅ Visor temporal en pantalla
      const visor = document.createElement('pre');
      visor.textContent = JSON.stringify(usuarioFinal, null, 2);
      visor.style.background = '#f9f2f4';
      visor.style.border = '1px solid #b03a2e';
      visor.style.padding = '10px';
      visor.style.marginTop = '20px';
      visor.style.color = '#333';
      visor.style.maxWidth = '400px';
      visor.style.marginLeft = '30px';
      document.body.appendChild(visor);

      mensaje.textContent = '✅ Usuario validado. Datos cargados correctamente.';
      mensaje.style.color = '#2e7d32';

      return; // ⛔ Detener redirección para ver el visor
    });
  </script>
</body>
</html>
