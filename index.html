<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ingreso Institucional</title>
  <link rel="stylesheet" href="estilos.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <header class="encabezado">
    <img src="logo_cda.png" alt="Logo institucional" />
    <h1>Grupo de Adoración y Alabanza</h1>
    <h2>Ingreso al sistema</h2>
  </header>

  <main>
    <form id="loginForm" class="formulario-dashboard">
      <label for="alias">Alias institucional</label>
      <input type="text" id="alias" placeholder="Tu alias" required />

      <label for="clave">Contraseña</label>
      <input type="password" id="clave" placeholder="Tu contraseña" required />

      <button type="submit">Ingresar</button>
      <div id="mensaje"></div>
    </form>
  </main>

  <script>
    const client = window.supabase.createClient(
      'https://TU_PROYECTO.supabase.co',
      'TU_PUBLIC_API_KEY'
    );

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const alias = document.getElementById('alias').value.trim();
      const clave = document.getElementById('clave').value;

      // 🔍 Buscar usuario por alias
      const { data: usuario, error } = await client
        .from('usuario')
        .select('alias, clave, nivelid, activo')
        .eq('alias', alias)
        .single();

      if (error || !usuario) {
        document.getElementById('mensaje').textContent = 'Alias no encontrado';
        return;
      }

      if (!usuario.activo) {
        document.getElementById('mensaje').textContent = 'Usuario inactivo';
        return;
      }

      if (usuario.clave !== clave) {
        document.getElementById('mensaje').textContent = 'Contraseña incorrecta';
        return;
      }

      // 🚀 Redirigir según nivelid
      switch (usuario.nivelid) {
        case 1:
          window.location.href = 'dashboard_admin.html';
          break;
        case 2:
          window.location.href = 'dashboard_editor.html';
          break;
        case 3:
          window.location.href = 'dashboard_musico.html';
          break;
        default:
          alert('Nivel no reconocido');
      }
    });
  </script>
</body>
</html>
