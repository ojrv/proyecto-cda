<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ingreso Institucional</title>
  <link rel="stylesheet" href="estilos.css" />

  <!-- ✅ Cargar Supabase antes del script de login -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <header class="encabezado">
    <img src="logo_cda.png" alt="Logo institucional" />
    <h1>Grupo de Adoración y Alabanza</h1>
    <h2>Ingreso al sistema</h2>
  </header>

  <main>
    <form id="loginForm" class="formulario-dashboard">
      <label for="alias">Alias institucional</label>
      <input type="text" id="alias" placeholder="Tu alias" required />

      <label for="clave">Contraseña</label>
      <input type="password" id="clave" placeholder="Tu contraseña" required />

      <button type="submit">Ingresar</button>
      <div id="mensaje"></div>
    </form>
  </main>

  <!-- ✅ Script de login con alias institucional -->
  <script>
    const client = window.supabase.createClient(
      'https://TU_PROYECTO.supabase.co',
      'TU_PUBLIC_API_KEY'
    );

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const alias = document.getElementById('alias').value.trim();
      const clave = document.getElementById('clave').value;

      // 🔍 Buscar email asociado al alias en la tabla "usuario"
      const { data: usuario, error: errorAlias } = await client
        .from('usuario')
        .select('email, rolid')
        .eq('alias', alias)
        .single();

      if (errorAlias || !usuario) {
        document.getElementById('mensaje').textContent = 'Alias no encontrado';
        return;
      }

      const email = usuario.email;

      // 🔐 Autenticación con email y contraseña
      const { data, error } = await client.auth.signInWithPassword({
        email,
        password: clave
      });

      if (error || !data?.user) {
        document.getElementById('mensaje').textContent = 'Contraseña incorrecta';
        return;
      }

      // 🧠 Obtener rol desde metadata o usar rolid como respaldo
      const rol = data.user.user_metadata?.rol || 'musico';

      // 🚀 Redirigir según rol
      switch (rol) {
        case 'admin':
          window.location.href = 'dashboard_admin.html';
          break;
        case 'editor':
          window.location.href = 'dashboard_editor.html';
          break;
        case 'musico':
          window.location.href = 'dashboard_musico.html';
          break;
        default:
          alert('Rol no reconocido');
      }
    });
  </script>
</body>
</html>
